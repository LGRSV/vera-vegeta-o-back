<html lang="pt-BR"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css"></head><body><div class="wrap">
<header class="cab"><h1>Trechos por município</h1><a class="cab-link" href="polos/#eto">Ranking dos alimentadores →</a></header>
<div id="mapa-to" class="mapa-to"><div class="mt-barra"><form class="ativo" id="ativo" role="search"><label for="ativo-q" class="rot">Selecione o ativo</label><div class="campo"><input class="busca" id="ativo-q" type="search" inputmode="search" autocomplete="off" placeholder="Ex.: 0300350016" enterkeyhint="search"><div id="ativo-res" aria-live="polite"></div></div></form><div class="mt-bmun"><label for="busca" class="rot">Município</label><div class="mun-cx"><input class="busca" id="busca" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="mun-lista" autocomplete="off" placeholder="Buscar município"><div class="mun-lista" id="mun-lista" role="listbox" aria-label="Municípios" hidden></div></div></div></div>
<div class="mt-mapa"><svg role="group" aria-label="Mapa dos municípios do Tocantins" tabindex="-1" viewBox="-6 -6 572 944"></svg><div class="mt-dica" aria-hidden="true"></div><p class="mt-regs" aria-label="Legenda do mapa"></p></div></div>
<script src="assets/mapa-municipios-dados.js"></script>
<script src="assets/mapa-municipios.js"></script>
<script src="assets/busca-ativo.js"></script>
<footer class="rodape"><p>T1 do DJ ao 1º religador, T2 de religador a religador (T2-A, T2-B…), T3-A, T3-B… depois de cada fusível.</p><p><a href="relatorio.html">Relatório de validação</a> · <a href="manifesto.json">manifesto.json</a></p></footer>
</div>
<script>const b=document.getElementById("busca");if(b)b.addEventListener("input",()=>{const q=b.value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();document.querySelectorAll("[data-busca]").forEach(e=>{e.hidden=!e.dataset.busca.includes(q)});document.querySelectorAll(".grade").forEach(g=>{let v=g.nextElementSibling;if(!v||!v.classList.contains("sem-res")){v=document.createElement("p");v.className="sem-res";v.setAttribute("role","status");g.after(v)}v.textContent=!q||g.querySelector("[data-busca]:not([hidden])")?"":"Nada encontrado para “"+b.value.trim()+"”."})});</script>
<script src="assets/menu.js"></script>
</body></html>
