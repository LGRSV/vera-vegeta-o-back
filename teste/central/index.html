<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* Tela inicial nova do ARGOS: módulos em cartões, cada módulo abre num quadro (iframe) e o dock embaixo troca entre eles.
   */
html,body{height:100%;overscroll-behavior-y:contain}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit;font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{flex:none;width:100%;max-width:none;height:76px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);position:relative;background:var(--bg)}
.logo{background:none;border:0;font:700 28px var(--f-mono);letter-spacing:.25em;padding:8px 10px;color:var(--fg)}
.logo span{display:block;font-size:9px;letter-spacing:.5em;color:var(--muted);margin-top:3px}
.logo span:before,.logo span:after{content:'';display:inline-block;width:20px;height:1px;vertical-align:middle;background:var(--accent);margin:0 9px}
.current{position:absolute;right:24px;color:var(--muted);font:600 var(--t-xs) var(--f-body);letter-spacing:.06em;text-transform:uppercase}
main{flex:1;min-height:0;position:relative;overflow:auto}
.home{max-width:1120px;margin:auto;padding:48px 24px 40px}
.hero{text-align:center;padding:0 0 36px}
.hero p{max-width:none;font:var(--t-xs) var(--f-mono);letter-spacing:.3em;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.module{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--r3);text-align:left;padding:22px;min-height:130px;color:var(--fg);text-decoration:none;transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
.module:hover{border-color:var(--accent);transform:translateY(-3px)}
.module b{display:block;font-size:18px;font-weight:600;margin:6px 0}
.module small{color:var(--muted);font-size:var(--t-sm)}
.module-icon{display:block;width:30px;height:30px;fill:none;stroke:var(--accent);stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px;transition:transform var(--dur)}
.module:hover .module-icon{transform:translateY(-2px)}
.secondary{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.secondary .module{min-height:100px}
.screen{position:absolute;inset:0;display:none}
.screen iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.tools{max-width:950px;margin:auto;padding:24px 24px 40px}
.tools h2{font:700 var(--t-xl) var(--f-display)}
.tools .module{margin:12px 0}
.dock{flex:none;display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);overflow-x:auto}
.dock button{border:0;background:transparent;color:var(--muted);border-radius:var(--r2);padding:0 15px;min-height:var(--alvo,44px);white-space:nowrap;font-size:var(--t-sm);font-weight:600}
.dock button:hover{color:var(--fg)}
.dock button[aria-current=page]{background:var(--seg-on);color:var(--fg);box-shadow:inset 0 -2px var(--accent)}
.anim{animation:up .35s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anim{animation:none}.module,.module-icon{transition:none}}
@media(max-width:700px){
  .home{padding:28px 14px 28px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .module{padding:16px;min-height:128px}
  .module b{font-size:16px}
  .hero p{letter-spacing:.15em}
  .secondary{grid-template-columns:1fr}
  .current{right:12px;max-width:34%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top{height:64px}
  .logo{font-size:23px}
  .dock{justify-content:flex-start}
  .dock button{padding:0 11px}
}
@media(max-height:480px){.top{display:none}}
.inst{position:fixed;right:16px;bottom:calc(12px + 56px + env(safe-area-inset-bottom));z-index:30;width:340px;max-width:calc(100vw - 32px);box-sizing:border-box;background:var(--paper);color:var(--fg);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh2);padding:16px 44px 16px 16px;animation:up .35s var(--ease) both}
.inst[hidden]{display:none}
.inst b{display:block;font-size:var(--t-sm);font-weight:600;margin-bottom:4px}
.inst p{margin:0 0 12px;max-width:none;font-size:var(--t-sm);color:var(--muted);line-height:1.45}
.inst .x{position:absolute;top:4px;right:4px;width:var(--alvo,40px);height:var(--alvo,40px);border:0;background:transparent;color:var(--muted);border-radius:var(--r2);font-size:20px;line-height:1}
.inst .x:hover{color:var(--fg)}
.inst .acoes{display:flex;gap:8px}
.inst .acoes button{min-height:var(--alvo,44px);padding:0 16px;border-radius:var(--r2);font-size:var(--t-sm);font-weight:600;border:1px solid var(--line);background:transparent;color:var(--fg)}
.inst .acoes .sim{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.inst-ln{background:none;border:0;padding:6px 4px;margin:14px auto 0;display:block;color:var(--muted);font-size:var(--t-sm);text-decoration:underline;text-underline-offset:3px;min-height:var(--alvo,44px)}
.inst-ln:hover{color:var(--fg)}
.inst-ln[hidden]{display:none}
body.inst-on .home{padding-bottom:calc(var(--inst-h,170px) + 24px)}
@media(max-width:700px){.inst{right:12px;left:12px;width:auto;max-width:none;bottom:calc(12px + 56px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){.inst{animation:none}}
</style></head><body>
<header class="top"><button class="logo" id="logo" aria-label="Voltar ao início">ARGOS<span>MANUTENÇÃO</span></button><span class="current" id="current" aria-live="polite"></span></header>
<main id="main">
  <section class="home" id="inicio">
    <h1 class="vh">ARGOS Manutenção</h1>
    <div class="hero"><p>MANUTENÇÃO · VEGETAÇÃO · PLANEJAMENTO</p></div>
    <div class="grid" id="modules"></div>

    <button type="button" class="module" id="atualiza"><b>Atualizar bases</b><small id="bases-txt">Enviar arquivos e acompanhar a rotina de atualização</small></button>

  <button type="button" class="x" id="inst-x" aria-label="Fechar aviso">&times;</button>
</aside>
<script src="../assets/modulos.js"></script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const MOD = (window.ARGOS_MODULOS || []).map(m => Object.assign({}, m, {url: new URL('../' + m.href, location.href).href}));
const ICON_SCRIPTS = '<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m6 9 3 3-3 3m7 0h5"/>';
const icone = p => `<svg class="module-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${p}</svg>`;
const frame = $('frame');
const PAGINAS = ['inicio', 'scripts'].concat(MOD.map(m => m.id));
const ORDEM = ['inicio'].concat(MOD.filter(m => m.dock).map(m => m.id), ['scripts']);
let ativo = null, pendente = false, ultimo = 0;

// ---- repositório do site (links de ferramentas e histórico): do endereço do github.io, com reserva
const gh = /\.github\.io$/.test(location.hostname) ? {dono: location.hostname.split('.')[0], repo: location.pathname.split('/')[1]} : {dono: 'LGRSV', repo: 'vera-vegeta-o-back'};
$('ln-ferr').href = `https://github.com/${gh.dono}/${gh.repo}/tree/gh-pages/ferramentas`;
$('ln-hist').href = `https://github.com/${gh.dono}/${gh.repo}/actions/workflows/atualiza-bases.yml`;

// ---- tela inicial, dock
$('modules').innerHTML = MOD.filter(m => m.grade).map(m =>
  `<a class="module" href="#${m.id}" data-ir="${m.id}">${icone(m.icone)}<b>${esc(m.titulo)}</b><small>${esc(m.desc)}</small></a>`).join('');
const rel = MOD.find(m => m.id === 'relatorio');
$('secundarios').innerHTML = `<a class="module" href="#scripts" data-ir="scripts">${icone(ICON_SCRIPTS)}<b>Scripts e atualização de dados</b><small>Enviar bases, acompanhar processamento e baixar scripts</small></a>` +
  (rel ? `<a class="module" href="#relatorio" data-ir="relatorio">${icone(rel.icone)}<b>${esc(rel.titulo)}</b><small>${esc(rel.desc)}</small></a>` : '');
$('dock').innerHTML = [['inicio', 'Início']].concat(MOD.filter(m => m.dock).map(m => [m.id, m.dock]), [['scripts', 'Scripts']])
  .map(([id, t]) => `<button type="button" data-ir="${id}">${esc(t)}</button>`).join('');
document.addEventListener('click', e => {
  const a = e.target.closest('[data-ir]'); if (!a) return;
  if (a.tagName === 'A' && (e.ctrlKey || e.metaKey || e.shiftKey || e.button)) return;   // abrir em outra aba
  e.preventDefault(); go(a.dataset.ir);
});
$('logo').addEventListener('click', () => go('inicio'));

// data da última atualização das bases (dados/bases.json, o mesmo do menu)
fetch('../dados/bases.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : null).then(b => {
  if (!b) return;
  const d = Object.values(b).map(x => [x.enviado, x.processado].filter(Boolean).sort().pop()).filter(Boolean).sort().pop();
  if (d) $('bases-txt').textContent = 'Enviar arquivos e acompanhar a rotina · última atualização em ' + d.slice(0, 10).split('-').reverse().join('/');
}).catch(() => {});

// ---- navegação: #id no endereço; Voltar/Avançar do navegador trocam o módulo
function go(id, pop, sohTroca) {
  if (!PAGINAS.includes(id)) id = 'inicio';
  if (id !== 'mapa') pendente = false;
  const m = MOD.find(x => x.id === id);
  const mudou = id !== ativo;
  ativo = id;
  $('inicio').hidden = id !== 'inicio';
  $('scripts').hidden = id !== 'scripts';
  if (id !== 'inicio') { $('inst').hidden = true; document.body.classList.remove('inst-on'); }
  $('screen').style.display = m ? 'block' : 'none';
  if (m && frame.dataset.page !== id) {
    frame.dataset.page = id;
    frame.title = m.titulo;
    const url = m.url + (id === 'mapa' ? location.search.replace(/[?&]classico=1/, '') : '');
    try { if (frame.contentWindow && frame.contentWindow.location.href !== 'about:blank') frame.contentWindow.location.replace(url); else frame.src = url; }
    catch (e) { frame.src = url; }
  }
  $('current').textContent = m ? m.titulo : id === 'scripts' ? 'Scripts' : '';
  document.querySelectorAll('#dock [data-ir]').forEach(b => {
    if (b.dataset.ir !== id) { b.removeAttribute('aria-current'); return; }
    b.setAttribute('aria-current', 'page');
    b.scrollIntoView({inline: 'nearest', block: 'nearest', behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'});
  });
  document.title = m ? m.titulo + ' · ARGOS' : id === 'scripts' ? 'Scripts · ARGOS' : 'ARGOS';
  const el = m ? $('screen') : $(id);
  if (mudou) { el.classList.remove('anim'); void el.offsetWidth; el.classList.add('anim'); $('main').scrollTop = 0; }
  if (location.hash.slice(1) !== id) { if (sohTroca) history.replaceState(null, '', '#' + id); else if (!pop) history.pushState(null, '', '#' + id); }
}
addEventListener('popstate', () => go(location.hash.slice(1) || 'inicio', true));

// ---- gesto de toque na borda troca de módulo (fora de mapas, campos e diálogos). A roda do mouse não troca: dava troca sem querer.
const FORA = '.mnu,.leaflet-container,.mt-mapa,dialog,input,select,textarea,[contenteditable],.pd-painel,.pd-drop,.dock,.top';
function menuAberto() {                                // menu ☰ da casca ou do módulo aberto: nunca troca de módulo
  let d = null; try { d = frame.contentDocument; } catch (e) { /* fora da mesma origem */ }
  return [document, d].some(x => x && x.querySelector('.mnu-btn[aria-expanded="true"]'));
}
function passo(d) {
  if (menuAberto()) return;
  if (Date.now() - ultimo < 1100) return;
  const i = ORDEM.indexOf(ativo);
  if (i < 0 || i + d < 0 || i + d >= ORDEM.length) return;
  ultimo = Date.now(); go(ORDEM[i + d]);
}
function rolaveis(el, d, w) {                          // algum contêiner acima do alvo ainda rola nesse sentido?
  for (; el && el !== w.document.documentElement; el = el.parentElement) {
    const s = w.getComputedStyle(el);
    if (/(auto|scroll)/.test(s.overflowY) && el.scrollHeight > el.clientHeight + 2) {
      if (d > 0 ? el.scrollTop + el.clientHeight < el.scrollHeight - 2 : el.scrollTop > 0) return true;
    }
  }
  return false;
}
function liga(w, raiz) {
  let x0 = 0, y0 = 0, ok = false, ini = 0;
  const borda = d => { const el = raiz ? raiz() : w.document.scrollingElement; return d > 0 ? el.scrollTop + el.clientHeight >= el.scrollHeight - 8 : el.scrollTop <= 0; };
  w.addEventListener('touchstart', e => {
    ok = e.touches.length === 1 && !(e.target.closest && e.target.closest(FORA));
    if (ok) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; ini = {up: borda(-1), down: borda(1)}; }
  }, {passive: true});
  w.addEventListener('touchend', e => {
    if (!ok) return;
    const t = e.changedTouches[0], dy = y0 - t.clientY, dx = x0 - t.clientX;
    const d = Math.sign(dy);                           // só troca se o gesto começou já na borda (rolagem que chega ao fim não troca)
    if (Math.abs(dy) > 95 && Math.abs(dy) > 2 * Math.abs(dx) && (d > 0 ? ini.down : ini.up) && !rolaveis(e.target, d, w)) passo(d);
  }, {passive: true});
}
liga(window, () => $('main'));

// ---- módulo carregado: gestos, título oculto (o módulo atual aparece no topo), tema e "Atualizar bases"
frame.addEventListener('load', () => {
  let w, d;
  try { w = frame.contentWindow; d = frame.contentDocument; if (!d) return; } catch (e) { console.warn('ARGOS: módulo fora da mesma origem'); return; }
  liga(w);
  const st = d.createElement('style');
  st.textContent = 'header.cab h1,.pd-cab h1{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}';
  d.head.appendChild(st);
  // o módulo que o quadro mostra de fato (links internos do módulo podem levar a outra página)
  const p = w.location.pathname;
  const raizSite = new URL('../', location.href).pathname;
  const m = MOD.slice().sort((a, b) => b.url.length - a.url.length).find(x => {
    const u = new URL(x.url).pathname;
    return p === u || (x.href.endsWith('/') && p.startsWith(u)) || (x.href === 'index.html' && p === raizSite);
  });
  if (!m) frame.dataset.page = '';                    // página fora dos módulos (ex.: alimentador): o dock recarrega o módulo
  else if (m.id !== ativo && ativo !== 'inicio' && ativo !== 'scripts') { frame.dataset.page = m.id; go(m.id, false, true); }
  // tema: o Night shift do módulo vale também para a casca
  const tema = () => { document.documentElement.dataset.theme = d.documentElement.dataset.theme || document.documentElement.dataset.theme; };
  tema(); new MutationObserver(tema).observe(d.documentElement, {attributes: true, attributeFilter: ['data-theme']});
  if (pendente) {
    pendente = false;
    const abre = () => {
      const bs = [...d.querySelectorAll('.mnu-lista button[aria-haspopup="dialog"]')];
      const b = bs.find(x => /Atualiza/.test(x.textContent)) || bs[0];
      if (b) b.click(); return !!b;
    };
    if (!abre()) setTimeout(abre, 600);                // o menu ☰ é montado pelo menu.js depois do load em algumas páginas
  }
});
$('atualiza').addEventListener('click', () => { pendente = true; frame.dataset.page = ''; go('mapa'); });

// Night shift na casca: Shift+K fora dos campos de texto troca claro/escuro (mesma escolha "tema" do menu ☰ das páginas).
// Com o foco dentro do módulo, quem troca é o menu.js do módulo e o observador acima traz o tema para a casca.
document.addEventListener('keydown', e => {
  if (!e.shiftKey || e.ctrlKey || e.metaKey || e.altKey || e.code !== 'KeyK') return;
  if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]')) return;
  e.preventDefault();
  const claro = document.documentElement.dataset.theme !== 'light', novo = claro ? 'light' : 'dark';
  document.documentElement.dataset.theme = novo;
  try { localStorage.setItem('tema', claro ? 'claro' : 'escuro'); } catch (er) { /* sem armazenamento: vale só nesta aba */ }
  try {
    const d = frame.contentDocument;
    if (d && d.documentElement) {
      d.documentElement.dataset.theme = novo;
      const b = d.querySelector('.mnu-tema'); if (b) b.setAttribute('aria-pressed', String(!claro));
    }
  } catch (er) { /* módulo fora da mesma origem */ }
});

new MutationObserver(() => { const m = $('cor-tema'); if (m) m.content = document.documentElement.dataset.theme === 'light' ? '#f2f3f0' : '#000000'; })
  .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---- atalho/app: aviso discreto para instalar o ARGOS (Chrome/Edge pelo evento do navegador; iPhone/iPad e Safari no Mac com o passo a passo)
(function () {
  const ua = navigator.userAgent, aviso = $('inst'), ln = $('inst-ln'), CHAVE = 'instalar-ate', TEMPO = 3500, DIAS = 30;
  const app = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches || navigator.standalone === true;
  if (app) return;
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const embutido = /FBAN|FBAV|Instagram|Line\/|GSA\//.test(ua);   // navegador de dentro de outro app: não tem "Adicionar à Tela de Início"
  const safariMac = !ios && /Macintosh/.test(ua) && /Safari\//.test(ua) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(ua) && Number((/Version\/(\d+)/.exec(ua) || [])[1]) >= 17;
  const PASSO = ios ? 'Toque em Compartilhar (nos iPhones mais novos ele fica no menu ⋯) e depois em Adicionar à Tela de Início.' : 'No menu do Safari: Arquivo › Adicionar ao Dock.';
  const OFERTA = 'Um atalho na área de trabalho ou na tela do celular que abre o ARGOS direto, em janela própria.';
  let passou = false, evento = null, jaInstalou = false, fechado = false;
  const adiado = () => { try { return Number(localStorage.getItem(CHAVE)) > Date.now(); } catch (e) { return false; } };
  const possivel = () => !jaInstalou && (!!evento || (ios && !embutido) || safariMac);
  const atualizaLink = () => { ln.hidden = !possivel(); };
  const espaco = sim => { document.body.classList.toggle('inst-on', sim); if (sim) document.body.style.setProperty('--inst-h', aviso.offsetHeight + 'px'); };
  const mostra = pediu => {
    if (!possivel()) return;
    $('inst-sim').hidden = !evento;
    $('inst-d').textContent = '';
    aviso.hidden = false; fechado = false;
    $('inst-d').textContent = evento ? OFERTA : PASSO;
    espaco(true);
    if (pediu === true) (evento ? $('inst-sim') : $('inst-nao')).focus();
  };
  const devolveFoco = () => { if (aviso.contains(document.activeElement)) (ln.hidden ? $('logo') : ln).focus(); };
  const fecha = adia => {
    devolveFoco(); aviso.hidden = true; fechado = true; espaco(false);
    if (adia) { try { localStorage.setItem(CHAVE, String(Date.now() + DIAS * 864e5)); } catch (e) { /* sem armazenamento: vale só nesta visita */ } }
  };
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); evento = e; atualizaLink(); if (passou && ativo === 'inicio' && !adiado() && !fechado && aviso.hidden) mostra(); });
  addEventListener('appinstalled', () => { jaInstalou = true; evento = null; devolveFoco(); aviso.hidden = true; ln.hidden = true; espaco(false); try { localStorage.setItem(CHAVE, String(Date.now() + 3650 * 864e5)); } catch (e) { /* ok */ } });
  $('inst-sim').addEventListener('click', () => {
    const e = evento; if (!e) return;
    evento = null; devolveFoco(); aviso.hidden = true; espaco(false); atualizaLink();
    try { e.prompt(); Promise.resolve(e.userChoice).then(r => { if (r && r.outcome !== 'accepted') fecha(true); }).catch(() => {}); } catch (er) { /* sem prompt */ }
  });
  $('inst-nao').addEventListener('click', () => fecha(true));
  $('inst-x').addEventListener('click', () => fecha(true));
  ln.addEventListener('click', () => mostra(true));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !aviso.hidden) fecha(true); });
  atualizaLink();
  setTimeout(() => { passou = true; if (ativo === 'inicio' && !adiado() && !fechado && aviso.hidden) mostra(); }, TEMPO);
})();

go(location.hash.slice(1) || 'inicio', true);
if (!location.hash) history.replaceState(null, '', '#inicio');
})();
</script>
