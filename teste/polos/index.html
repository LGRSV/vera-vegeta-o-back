<header><h1>Ranking por polo</h1><p>Escolha o polo e veja os alimentadores ou os trechos, do que tem mais NAE (árvore/eucalipto na rede) para o que tem menos; toque no título de uma coluna para ordenar por ela.</p></header>

<script src="../assets/ranking-polos-dados.js"></script>
<script src="../assets/ranking-polos.js"></script>

<script>const b=document.getElementById("busca");if(b)b.addEventListener("input",()=>{const q=b.value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();document.querySelectorAll("[data-busca]").forEach(e=>{e.hidden=!e.dataset.busca.includes(q)});});</script>
