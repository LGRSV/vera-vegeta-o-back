<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script>(function(){var t;try{t=localStorage.getItem("tema")}catch(e){}document.documentElement.dataset.theme=t==="claro"?"light":"dark"})()</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/leaflet/leaflet.css">
<style>
:root{--pd-ok:#22c55e;--pd-pend:#facc15;--pd-crit:#ef4444;--pd-sem:#d1d5db;--pd-nae:#8a0303}
.w{max-width:1320px;margin:0 auto}
.pd-cab{display:grid;gap:4px}
.pd-cab h1{font:700 var(--t-2xl,30px)/1.1 var(--f-display);margin:0}
.pd-cab p{margin:0;color:var(--muted);font-size:var(--t-sm)}
/* mapa */
.mapbox{position:relative;z-index:0;isolation:isolate;border-radius:var(--r3);overflow:hidden;background:var(--mapbg);box-shadow:var(--sh2)}
#map{height:min(80vh,820px);min-height:460px;background:var(--mapbg)}
.mapbox:fullscreen{border-radius:0}
.mapbox:fullscreen #map,body.tela-cheia #map{height:100vh;height:100dvh;min-height:0}
body.tela-cheia{overflow:hidden}
body.tela-cheia .mapbox{position:fixed;inset:0;z-index:3000;border-radius:0}
.mapbox :focus-visible{outline:2px solid var(--foco-mapa);outline-offset:2px}
.leaflet-container{font-family:var(--f-body)}
.leaflet-container .leaflet-control-attribution{background:rgba(15,20,23,.6);color:#cfd5d8;font-size:10.5px;border-radius:var(--r1) 0 0 0;padding:1px 6px}
.leaflet-container .leaflet-control-attribution a{color:#e7eaeb}
.g-logo{height:16px;vertical-align:-4px;margin-right:4px}
.leaflet-tooltip.pd-tip{background:var(--vidro);color:var(--vidro-fg);border:1px solid var(--vidro-borda);border-radius:var(--r2);box-shadow:var(--sh-vidro);padding:6px 10px;font:500 var(--t-sm)/1.35 var(--f-body)}
.leaflet-tooltip.pd-tip::before{display:none}
.leaflet-tooltip.pd-tip small{display:block;color:#cfd5d8}
.vidro{background:var(--vidro);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--vidro-fg);border:1px solid var(--vidro-borda);border-radius:var(--r2);box-shadow:var(--sh-vidro)}
/* canto de cima: olho + cidades */
.pd-topo{position:absolute;left:12px;top:12px;z-index:900;display:flex;gap:var(--s2);align-items:center;max-width:calc(100% - 24px)}
.pd-olho{flex:none;width:48px;height:44px;display:grid;place-items:center;padding:0;border-radius:999px;cursor:pointer}
.pd-olho img{width:34px;height:auto;pointer-events:none}
.pd-olho[aria-expanded=true]{border-color:var(--accent)}
.pd-cids{display:flex;gap:2px;padding:3px}
.pd-cids button{font:600 var(--t-sm) var(--f-body);color:#cfd5d8;background:none;border:0;border-radius:var(--r1);padding:0 12px;min-height:36px;cursor:pointer}
.pd-cids button:hover{color:#fff;background:var(--vidro-hover)}
.pd-cids button[aria-pressed=true]{background:#323a41;color:#fff;box-shadow:inset 0 -2px 0 var(--accent)}
/* lista do olho */
.pd-drop{position:absolute;left:12px;top:64px;z-index:950;width:min(360px,calc(100% - 24px));max-height:calc(100% - 140px);overflow:auto;overscroll-behavior:contain;padding:var(--s2);display:grid;gap:var(--s2)}
.pd-drop[hidden],#opcoes[hidden],.pd-res[hidden]{display:none}
.pd-drop .busca{max-width:none;min-height:42px;background:rgba(0,0,0,.35);color:#fff;border-color:var(--vidro-borda)}
.pd-drop .busca::placeholder{color:#aab3b9}
.pd-t{margin:var(--s1) var(--s2) 0;font:700 var(--t-xs)/1.4 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:#aab3b9}
.pd-op{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:44px;padding:6px var(--s2);border:0;border-radius:var(--r1);background:none;color:#fff;font:600 var(--t-sm) var(--f-body);text-align:left;cursor:pointer}
.pd-op:hover{background:var(--vidro-hover)}
.pd-op .n{flex:1;min-width:0}
.pd-op .c{font:600 var(--t-xs) var(--f-mono);color:#cfd5d8;white-space:nowrap}
.pd-op i{flex:none;width:14px;height:14px;border-radius:3px;background:var(--c)}
.pd-op i.pt{border-radius:50%;border:1.5px solid #fff}
.pd-op svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pd-op[aria-pressed=false]{color:#8b959c}
.pd-op[aria-pressed=false] i{opacity:.35}
.pd-op .on,.pd-op[aria-pressed=false] .off{display:block}.pd-op .off,.pd-op[aria-pressed=false] .on{display:none}
.pd-seg{display:flex;gap:2px;padding:0 var(--s2) var(--s1)}
.pd-seg button{flex:1;font:600 var(--t-sm) var(--f-body);color:#cfd5d8;background:rgba(255,255,255,.06);border:0;border-radius:var(--r1);min-height:36px;cursor:pointer}
.pd-seg button[aria-pressed=true]{background:#323a41;color:#fff;box-shadow:inset 0 -2px 0 var(--accent)}
.pd-res{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.pd-res li{display:grid;gap:1px;padding:6px var(--s2);border-radius:var(--r1);cursor:pointer}
.pd-res li b{font:600 var(--t-sm)/1.25 var(--f-body);overflow-wrap:anywhere}
.pd-res li small{font:var(--t-xs)/1.3 var(--f-mono);color:#aab3b9}
.pd-res li:hover,.pd-res li[aria-selected=true]{background:var(--vidro-hover);box-shadow:inset 0 0 0 1px var(--accent)}
.pd-res .nada{cursor:default;color:#aab3b9;font-size:var(--t-sm)}
/* legenda (canto de baixo, à esquerda) */
.pd-leg{position:absolute;left:12px;bottom:24px;z-index:900;display:grid;gap:4px;padding:var(--s2) var(--s3);font:600 var(--t-xs)/1.2 var(--f-body)}
.pd-leg[hidden]{display:none}
.pd-leg div{display:flex;align-items:center;gap:var(--s2)}
.pd-leg i{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.pd-leg i.pt{border-radius:50%;border:1.5px solid #fff;width:11px;height:11px}
.pd-leg hr{border:0;border-top:1px solid var(--vidro-borda);margin:2px 0}
/* tela cheia (canto de baixo, à direita) */
.pd-tc{position:absolute;right:12px;bottom:28px;z-index:900;width:44px;height:44px;display:grid;place-items:center;padding:0;cursor:pointer}
.pd-tc:hover{background:#262d33}
.pd-tc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pd-tc .sai,.pd-tc[aria-pressed=true] .abre{display:none}.pd-tc[aria-pressed=true] .sai{display:block}
.banner{position:absolute;left:72px;right:72px;top:12px;z-index:960;padding:var(--s2) var(--s3);font-size:var(--t-sm)}
.banner[hidden]{display:none}
.banner b{color:#fde68a}
/* painel de detalhes, dentro do mapa */
.pd-painel{position:absolute;top:12px;right:12px;bottom:84px;z-index:940;width:min(360px,calc(100% - 24px));background:var(--paper);color:var(--fg);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh2);padding:var(--s4);overflow:auto;overscroll-behavior:contain}
.pd-painel[hidden]{display:none}
.pd-x{position:absolute;top:var(--s2);right:var(--s2);width:40px;height:40px;display:grid;place-items:center;padding:0;border:1px solid var(--line-forte);border-radius:var(--r2);background:var(--paper);color:var(--fg);cursor:pointer}
.pd-x:hover{border-color:var(--accent)}
.pd-x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.pd-det{display:grid;gap:var(--s4)}
.pd-det h2{font:700 var(--t-xl)/1.2 var(--f-display);margin:0;padding-right:48px;overflow-wrap:anywhere}
.pd-det h2:focus{outline:none}
.pd-tipo{margin:2px 0 0;font:var(--t-xs)/1.4 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.pd-sit{display:grid;gap:4px;border-left:4px solid var(--c);padding:6px var(--s3);background:color-mix(in srgb,var(--fg) 4%,transparent);border-radius:0 var(--r1) var(--r1) 0}
.pd-sit b{font:700 var(--t-md)/1.2 var(--f-body)}
.pd-sit span{font-size:var(--t-sm);color:var(--muted)}
.pd-kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3) var(--s4);margin:0}
.pd-kp div{border-top:2px solid var(--line);padding-top:var(--s2);min-width:0}
.pd-kp dt{font:600 var(--t-xs)/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pd-kp dd{margin:2px 0 0;font:700 var(--t-lg)/1.25 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pd-kp dd small{display:block;font:var(--t-xs)/1.3 var(--f-body);color:var(--muted)}
.pd-det h3{font:600 var(--t-xs)/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 var(--s2)}
.pd-als{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.pd-als li{font:600 var(--t-xs) var(--f-mono);border:1px solid var(--line);border-radius:var(--rp);padding:4px 10px}
.pd-als li.alto{border-color:var(--alerta);color:var(--alerta)}
.pd-als li em{font:600 10px var(--f-body);font-style:normal;letter-spacing:.04em;text-transform:uppercase;margin-left:6px}
.pd-peq{margin:var(--s2) 0 0;font-size:var(--t-xs);color:var(--muted)}
.pd-os{list-style:none;margin:0;padding:0;display:grid;gap:var(--s1)}
.pd-os li{display:grid;gap:1px;border-left:3px solid var(--line-forte);border-radius:0 var(--r1) var(--r1) 0;padding:4px var(--s3);background:color-mix(in srgb,var(--fg) 4%,transparent);font-size:var(--t-sm)}
.pd-os li.ex{border-left-color:var(--pd-ok)}
.pd-os li.pe{border-left-color:var(--pd-pend)}
.pd-os li.nae{border-left-color:var(--pd-nae)}
.pd-nae-t{display:flex;align-items:center;gap:var(--s2)}
.pd-nae-t i{width:12px;height:12px;border-radius:50%;background:var(--pd-nae);border:1.5px solid #fff;flex:none}
.pd-os b{font:600 var(--t-sm) var(--f-mono);overflow-wrap:anywhere}
.pd-os span{color:var(--muted);font-size:var(--t-xs)}
.pd-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.pd-links a{display:grid;justify-items:center;gap:2px;padding:var(--s2) 4px;min-height:52px;border:1px solid var(--line-forte);border-radius:var(--r2);color:var(--fg);text-decoration:none;font:600 var(--t-xs)/1.2 var(--f-body);text-align:center}
.pd-links a:hover{border-color:var(--accent);color:var(--accent)}
.pd-links svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nota{color:var(--muted);font-size:var(--t-xs);margin:0;max-width:110ch}
@media(max-width:700px){
  #map{height:clamp(420px,72svh,700px)}
  .pd-painel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:58%;border-radius:var(--r3)}
  .pd-leg{bottom:20px}
  body.pd-aberto .pd-leg,body.pd-aberto .pd-tc{display:none}
  .pd-cids button{padding:0 9px}
  .banner{left:12px;right:12px;top:64px}
}
</style>
</head><body><div class="wrap w">
<header class="pd-cab"><span class="eyebrow">Manutenção · poda de árvore</span><h1>Mapa de podas</h1><p id="fonte"></p></header>

<div class="mapbox" id="box">
  <div id="map" role="application" aria-label="Mapa de podas"></div>
  <div class="pd-topo">
    <button type="button" class="pd-olho vidro" id="olho" aria-expanded="false" aria-controls="drop" aria-label="Buscar e escolher o que ver no mapa" title="Buscar e camadas">
      <img src="../assets/argos.png" alt="" width="34" height="23"></button>
    <div class="pd-cids vidro" id="cids" role="group" aria-label="Cidade"></div>
  </div>
  <div class="pd-drop vidro" id="drop" hidden>
    <input id="q" class="busca" type="search" placeholder="Quadra, OS ou ativo" autocomplete="off" spellcheck="false" aria-label="Buscar quadra, OS ou ativo" aria-controls="res">
    <ul class="pd-res" id="res" role="listbox" aria-label="Resultados" hidden></ul>
    <div id="opcoes">
      <p class="pd-t">Camadas</p><div id="cam"></div>
      <p class="pd-t">Situação</p><div id="sit"></div>
      <p class="pd-t">Fundo</p>
      <div class="pd-seg" id="fundo"><button type="button" data-f="sat" aria-pressed="true">Satélite</button><button type="button" data-f="liso" aria-pressed="false">Liso</button></div>
    </div>
  </div>
  <div class="pd-leg vidro" id="leg" aria-label="Legenda"></div>
  <button type="button" class="pd-tc vidro" id="tc" aria-pressed="false" aria-label="Tela cheia" title="Tela cheia">
    <svg class="abre" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="sai" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
  <aside class="pd-painel" id="painel" aria-label="Detalhes" aria-live="polite" hidden></aside>
  <div class="banner vidro" id="nosat" hidden><b>A imagem de satélite não carregou.</b> Confira a internet.</div>
  <div class="banner vidro" id="nolib" hidden><b>O mapa não carregou.</b> Recarregue a página.</div>
</div>

<p class="nota" id="nota"></p>
</div>

<script src="../assets/leaflet/leaflet.js"></script>
<script src="../assets/mapa-satelite.js"></script>
<script src="../dados/podas.js"></script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const nf = n => Number(n).toLocaleString('pt-BR');
const br = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '';
const sem = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const cap = s => { s = String(s ?? '').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };
const X = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const OLHO = '<svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>' +
  '<svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A16.6 16.6 0 0 0 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

const ORDEM = ['executado', 'pendente', 'critico', 'sem'];
const ROT = {executado: 'Executado', pendente: 'Pendente', critico: 'Crítico', sem: 'Sem poda recente'};
const ROTP = {executado: 'Executada (6 meses)', pendente: 'Pendente', critico: 'Pendente emergencial/urgente'};
const COR = {executado: '#22c55e', pendente: '#facc15', critico: '#ef4444', sem: '#d1d5db'};
const OPAC = {executado: .5, pendente: .55, critico: .6, sem: .25};
const SANGUE = '#8a0303';
const P = window.PODAS;
const CIDADES = P && P.cidades ? ['Palmas', 'Araguaína', 'Gurupi'].filter(c => Array.isArray(P.cidades[c])) : [];
const titulo = a => a.nome ? a.nome : (a.tipo === 'bairro' ? a.id : 'Quadra ' + a.id);
const TIPO = t => t === 'poste' ? 'Poste' : t === 'TR' ? 'Trafo' : 'Chave/equipamento (' + t + ')';
const mesTxt = m => ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][+m.slice(5, 7) - 1] + '/' + m.slice(0, 4);
const dataNae = d => br(d.slice(0, 10)) + (d.length > 10 ? ' ' + d.slice(11) : '');

if (!P || !CIDADES.length) { $('nolib').innerHTML = '<b>Os dados de poda não carregaram.</b> Recarregue a página.'; $('nolib').hidden = false; return; }
if (typeof L === 'undefined') { $('nolib').hidden = false; return; }

const mm = P.nae_meses || [];
$('fonte').textContent = 'Palmas, Araguaína e Gurupi · OS status de ' + br(P.gerado) + (mm.length ? ' · NAE de ' + mesTxt(mm[0]) + ' a ' + mesTxt(mm[mm.length - 1]) : '');
$('nota').textContent = 'Quadra = setor censitário do IBGE 2022. OS no poste da estrutura; sem ele no mapa, no trafo, na chave ou em outro ativo da OS. ' +
  'Crítico: OS emergencial/urgente pendente, ou alimentador com NAE alto (quinto mais alto da cidade) sem poda em 6 meses. NAE só do perímetro urbano.';

// ---- estado ---------------------------------------------------------------------------------------------
let cidade = CIDADES[0];
const ativos = new Set(ORDEM);                          // situações ligadas
const camadas = {areas: true, os: true, nae: true};     // o que aparece junto no mapa
let sel = null, selPt = null, fundo = 'sat';
const cache = {}, pcache = {}, ncache = {};
const mobile = () => matchMedia('(max-width:700px)').matches;

// ---- mapa (sem os botões + e −: roda do mouse, pinça e teclado) ------------------------------------------
const map = L.map('map', {zoomControl: false, preferCanvas: true, renderer: L.canvas({tolerance: L.Browser.mobile ? 8 : 3}), zoomSnap: 0.25, zoomDelta: 0.5, maxZoom: 21});
window.__map = map;
map.attributionControl.setPrefix(false);

// Satélite: Google (Map Tiles API, com a chave de assets/mapa-satelite.js) ou Esri World Imagery.
const GKEY = (window.ARGOS_SAT && window.ARGOS_SAT.google) || '';
let falhas = 0, sat = null;
const SAT = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/';
// Esri: onde não há foto num zoom o servidor responde 404 (blankTile=false) e o quadro vira a foto do nível de cima ampliada
const Esri = L.TileLayer.extend({
  getTileUrl: c => `${SAT}${c.z}/${c.y}/${c.x}?blankTile=false`,
  createTile(c, done) { const t = L.TileLayer.prototype.createTile.call(this, c, done); t._xyz = c; t._k = 0; return t; },
  _tileOnError(done, t, e) {
    const c = t._xyz, k = ++t._k;
    if (!c || k > 6 || c.z - k < 0) return L.TileLayer.prototype._tileOnError.call(this, done, t, e);
    const f = 2 ** k, n = 256 * f, x = (c.x % f) * 256, y = (c.y % f) * 256;
    Object.assign(t.style, {width: n + 'px', height: n + 'px', marginLeft: -x + 'px', marginTop: -y + 'px', mixBlendMode: 'normal',
      clipPath: `inset(${y}px ${n - x - 256}px ${n - y - 256}px ${x}px)`});
    t.src = `${SAT}${c.z - k}/${c.y >> k}/${c.x >> k}?blankTile=false`;
  }
});
const esri = () => new Esri(SAT + '{z}/{y}/{x}', {maxZoom: 21, maxNativeZoom: 19, attribution: 'Imagem © Esri — Esri, Maxar, Earthstar Geographics'})
  .on('tileerror', () => { if (++falhas > 3) $('nosat').hidden = false; });
async function sessaoGoogle() {
  const K = 'argos-gtiles';
  try { const s = JSON.parse(localStorage.getItem(K) || 'null'); if (s && s.key === GKEY && s.expiry * 1000 > Date.now() + 36e5) return s.session; } catch (e) {}
  const r = await fetch('https://tile.googleapis.com/v1/createSession?key=' + encodeURIComponent(GKEY), {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({mapType: 'satellite', language: 'pt-BR', region: 'BR'})});
  if (!r.ok) throw new Error('sessão ' + r.status);
  const j = await r.json();
  try { localStorage.setItem(K, JSON.stringify({key: GKEY, session: j.session, expiry: +j.expiry})); } catch (e) {}
  return j.session;
}
let gSess = null, gCopy = '', gT = 0;
const LOGO = '<img class="g-logo" src="https://maps.gstatic.com/mapfiles/api-3/images/google_white5.png" alt="Google Maps">';
function creditoGoogle() {                              // o crédito da Google muda com a área vista (viewport)
  clearTimeout(gT);
  gT = setTimeout(async () => {
    if (!gSess || !sat || !map.hasLayer(sat)) return;
    const b = map.getBounds(), z = Math.round(map.getZoom());
    try {
      const r = await fetch(`https://tile.googleapis.com/tile/v1/viewport?session=${gSess}&key=${encodeURIComponent(GKEY)}&zoom=${z}` +
        `&north=${b.getNorth().toFixed(5)}&south=${b.getSouth().toFixed(5)}&east=${b.getEast().toFixed(5)}&west=${b.getWest().toFixed(5)}`);
      const j = await r.json();
      const novo = LOGO + esc(j.copyright || 'Google');

  if (i >= 0) { const li = $('op' + i); if (li) li.scrollIntoView({block: 'nearest'}); }
}
function irPara(r) {

  if (r.c !== cidade) { fechar(); mostrar(r.c, false); botoesCidade(); opcoes(); legenda(); }
  if (r.k === 'a') {
    if (!camadas.areas) { camadas.areas = true; mostrar(cidade, false); opcoes(); legenda(); }
    if (!ativos.has(r.a.st)) { ativos.add(r.a.st); aplicar(r.c); aplicarPts(r.c); opcoes(); legenda(); }
    const lay = construir(r.c).lays.find(l => l._pa === r.a); if (!lay) return;
    escolher(r.a, r.c, lay, true);
    map.fitBounds(lay.getBounds(), {maxZoom: 18, paddingTopLeft: [24, 72], paddingBottomRight: [mobile() ? 24 : 390, mobile() ? Math.round(map.getSize().y * .5) : 24]});
  } else {
    if (!camadas.os) { camadas.os = true; mostrar(cidade, false); opcoes(); legenda(); }
    if (!ativos.has(r.pt[2])) { ativos.add(r.pt[2]); aplicar(r.c); aplicarPts(r.c); opcoes(); legenda(); }
    escolherPt(r.pt, true);
    map.setView([r.pt[0], r.pt[1]], Math.max(map.getZoom(), 18));
  }
}
q.addEventListener('input', lista);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && !res.hidden) { e.preventDefault(); marca(Math.min(achados.length - 1, marc + 1)); }
  else if (e.key === 'ArrowUp' && !res.hidden) { e.preventDefault(); marca(Math.max(0, marc - 1)); }
  else if (e.key === 'Enter') { e.preventDefault(); if (achados.length) irPara(achados[marc >= 0 ? marc : 0]); }
});
res.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (!li) return; e.preventDefault(); irPara(achados[+li.dataset.i]); });

// ---- tela cheia -----------------------------------------------------------------------------------------
const box = $('box'), tc = $('tc');
const nativa = !!(box.requestFullscreen || box.webkitRequestFullscreen);
const emTela = () => !!(document.fullscreenElement || document.webkitFullscreenElement) || document.body.classList.contains('tela-cheia');
function ajustaTc() {
  const on = emTela();
  tc.setAttribute('aria-pressed', String(on)); tc.setAttribute('aria-label', on ? 'Sair da tela cheia' : 'Tela cheia'); tc.title = tc.getAttribute('aria-label');
  setTimeout(() => map.invalidateSize(), 60);
}
tc.addEventListener('click', () => {
  if (emTela()) {
    if (document.fullscreenElement) document.exitFullscreen(); else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
    document.body.classList.remove('tela-cheia'); ajustaTc();
  } else if (nativa) {
    const p = (box.requestFullscreen || box.webkitRequestFullscreen).call(box);
    if (p && p.catch) p.catch(() => { document.body.classList.add('tela-cheia'); ajustaTc(); });
  } else { document.body.classList.add('tela-cheia'); ajustaTc(); }
});
document.addEventListener('fullscreenchange', ajustaTc);
document.addEventListener('webkitfullscreenchange', ajustaTc);

botoesCidade(); opcoes(); legenda();
mostrar(cidade, true);
window.__podas = {estado: () => ({cidade, ativos: [...ativos], sel: sel && sel.a.id, selPt: selPt && selPt[3], fundo, google: !!gSess}),
  camada: id => (cache[cidade] ? cache[cidade].lays.find(l => l._pa.id === id) : null),
  visivel: id => { const l = window.__podas.camada(id); return !!l && l._pv !== false && map.hasLayer(l); },
  pontos: () => map.hasLayer(pontos(cidade).grupo) ? pontos(cidade).grupo.getLayers().length : 0, nae: () => naeLay.getLayers().length,
  naeTodos: () => map.hasLayer(naeTodos(cidade)) ? naeTodos(cidade).getLayers().length : 0, camadas: () => ({...camadas})};
})();
